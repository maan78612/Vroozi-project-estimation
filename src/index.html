<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sherlock Holmes — Project Estimation</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Stamp the theme before Angular bootstraps / first paint, so there's
    // no flash of the wrong theme. ThemeService (core/services/theme)
    // reads/writes the same 'pe_theme' localStorage key from here on.
    (function () {
      try {
        var stored = localStorage.getItem('pe_theme');
        var mode = stored === 'dark' || stored === 'light'
          ? stored
          : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

<div class="filter-bar-card">
  <div class="search-field">
    <span class="material-symbols-outlined search-icon">search</span>
    <input
      #searchRef
      type="text"
      [value]="searchQuery()"
      (input)="searchChange.emit(searchRef.value)"
      [placeholder]="searchPlaceholder()"
    />
  </div>

  <select class="filter-select" [value]="erpFilter()" (change)="erpChange.emit($any($event.target).value)">
    <option value="">All ERPs</option>
    @for (erp of availableErps(); track erp) {
      <option [value]="erp">{{ erp }}</option>
    }
  </select>

  <select class="filter-select" [value]="sortBy()" (change)="sortChange.emit($any($event.target).value)">
    <option value="name">Sort: Name (A–Z)</option>
    <option value="size">Sort: Largest first</option>
    <option value="range">Sort: Longest range first</option>
  </select>

  <div class="bar-divider" aria-hidden="true"></div>

  <div class="size-filter-group">
    <span class="size-filter-label">Size</span>
    <div class="size-square-row">
      @for (size of sizeOrder; track size) {
        <button
          type="button"
          class="size-square"
          [class]="'size-square-' + size.toLowerCase()"
          [class.is-active]="sizeFilter() === size"
          [attr.aria-pressed]="sizeFilter() === size"
          (click)="sizeToggle.emit(size)"
        >
          {{ size }}
        </button>
      }
    </div>
  </div>

  @if (hasActiveFilters()) {
    <button type="button" class="clear-filters-btn" (click)="clear.emit()">
      <span class="material-symbols-outlined">close</span>
      Clear filters
    </button>
  }
</div>

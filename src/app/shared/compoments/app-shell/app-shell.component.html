<div class="shell">
  <header class="shell-header">
    <div class="shell-header-inner">
      <div class="shell-brand-row">
        <span class="shell-brand">ProjectsEstimation</span>

        <nav class="shell-nav">
          @for (link of navLinks(); track link.path) {
            <a
              class="shell-nav-link"
              [routerLink]="link.path"
              routerLinkActive="shell-nav-link-active"
            >
              {{ link.label }}
            </a>
          }
        </nav>
      </div>

      <div class="shell-actions">
        <div class="shell-user">
          <div class="shell-avatar">{{ currentUser()?.name | initials }}</div>
          <span class="shell-user-name">{{ currentUser()?.name }}</span>
        </div>
        <button type="button" class="shell-signout" (click)="signOut()">
          <span class="material-symbols-outlined">logout</span>
          <span>Sign out</span>
        </button>

        <button
          type="button"
          class="shell-menu-toggle"
          [attr.aria-expanded]="mobileMenuOpen()"
          aria-label="Toggle navigation menu"
          (click)="toggleMobileMenu()"
        >
          <span class="material-symbols-outlined">{{ mobileMenuOpen() ? 'close' : 'menu' }}</span>
        </button>
      </div>
    </div>

    @if (mobileMenuOpen()) {
      <nav class="shell-mobile-nav">
        @for (link of navLinks(); track link.path) {
          <a
            class="shell-mobile-nav-link"
            [routerLink]="link.path"
            routerLinkActive="shell-mobile-nav-link-active"
            (click)="closeMobileMenu()"
          >
            <span class="material-symbols-outlined">{{ link.icon }}</span>
            {{ link.label }}
          </a>
        }
        <button type="button" class="shell-mobile-nav-link shell-mobile-signout" (click)="signOut()">
          <span class="material-symbols-outlined">logout</span>
          Sign out
        </button>
      </nav>
    }
  </header>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>

<button
  [type]="type()"
  class="btn"
  [class.btn-primary]="variant() === 'primary'"
  [class.btn-secondary]="variant() === 'secondary'"
  [class.btn-link]="variant() === 'link'"
  [class.btn-danger]="danger()"
  [class.btn-full-width]="fullWidth()"
  [class.btn-loading]="loading()"
  [class.btn-disabled]="isDisabled()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading()"
  (click)="onClick()"
>
  @if (loading()) {
    <span class="btn-spinner" aria-hidden="true"></span>
  }

  @if (showBackArrow() && !loading()) {
    <span class="material-symbols-outlined btn-icon">arrow_back</span>
  }

  @if (icon() && !loading()) {
    <span class="material-symbols-outlined btn-icon">{{ icon() }}</span>
  }

  <span class="btn-label">{{ displayLabel() }}</span>

  @if (trailingIcon() && !loading()) {
    <span class="material-symbols-outlined btn-icon">{{ trailingIcon() }}</span>
  }
</button>

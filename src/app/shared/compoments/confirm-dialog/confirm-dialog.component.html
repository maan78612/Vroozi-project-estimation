<div class="confirm-backdrop" (click)="onBackdropClick()">
  <div
    class="confirm-panel"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    @if (showLogo()) {
      <div class="confirm-logo">
        <app-logo [iconOnly]="true" [size]="28" />
      </div>
    }
    <h3 class="confirm-title">{{ title() }}</h3>
    <p class="confirm-message">{{ message() }}</p>

    @if (errorMessage()) {
      <div class="banner banner-error confirm-error">
        <span class="material-symbols-outlined banner-icon">error</span>
        <p class="banner-message">{{ errorMessage() }}</p>
      </div>
    }

    <div class="confirm-actions">
      @if (showCancel()) {
        <app-button
          variant="link"
          [label]="cancelLabel()"
          [fullWidth]="false"
          [disabled]="confirming()"
          (clicked)="onCancel()"
        />
      }
      <app-button
        variant="primary"
        [danger]="danger()"
        [label]="confirmLabel()"
        [loadingLabel]="loadingLabel()"
        [loading]="confirming()"
        [fullWidth]="false"
        (clicked)="confirmed.emit()"
      />
    </div>
  </div>
</div>

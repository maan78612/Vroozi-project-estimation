<div class="confirm-backdrop" (click)="onBackdropClick()">
  <div
    class="confirm-panel"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <h3 class="confirm-title">{{ title() }}</h3>
    <p class="confirm-message">{{ message() }}</p>

    @if (errorMessage()) {
      <p class="confirm-error">{{ errorMessage() }}</p>
    }

    <div class="confirm-actions">
      <app-button
        variant="link"
        [label]="cancelLabel()"
        [fullWidth]="false"
        [disabled]="confirming()"
        (clicked)="onCancel()"
      />
      <app-button
        variant="primary"
        [danger]="true"
        [label]="confirmLabel()"
        loadingLabel="Deleting…"
        [loading]="confirming()"
        [fullWidth]="false"
        (clicked)="confirmed.emit()"
      />
    </div>
  </div>
</div>

<div class="add-option-backdrop" (click)="onBackdropClick()">
  <div
    class="add-option-panel"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    (click)="$event.stopPropagation()"
  >
    <!-- Header — same band as the supplier picker dialog -->
    <div class="add-option-head">
      <div class="add-option-head-texts">
        <span class="add-option-eyebrow">{{ eyebrow() }}</span>
        <h3 class="add-option-title">{{ title() }}</h3>
        @if (subtitle()) {
          <p class="add-option-subtitle">{{ subtitle() }}</p>
        }
      </div>
      <button type="button" class="add-option-close" aria-label="Close" (click)="onCancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Body -->
    <div class="add-option-body">
      <app-form
        [fields]="fields()"
        [initialValue]="initialValue()"
        [submitLabel]="submitLabel()"
        loadingLabel="Saving…"
        [isSubmitting]="saving()"
        [submitError]="errorMessage()"
        (formSubmit)="save.emit($event)"
      />

      <div class="add-option-cancel-row">
        <app-button
          variant="link"
          label="Cancel"
          [fullWidth]="false"
          [disabled]="saving()"
          (clicked)="onCancel()"
        />
      </div>
    </div>
  </div>
</div>

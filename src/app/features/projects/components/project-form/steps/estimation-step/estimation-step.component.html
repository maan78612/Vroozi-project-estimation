<div class="step-body" [formGroup]="form()">

  <div class="field-block">
    <label class="field-label">
      Tentative Range (Days) <span class="required-mark" aria-hidden="true">*</span>
    </label>
    <p class="field-hint">Drag both handles to set the low and high day estimate for this project.</p>

    <div class="slider-card" [class.is-error]="hasError('tentativeRangeDays')">
      <app-range-slider formControlName="tentativeRangeDays" [min]="0" [max]="150" [step]="1" unit="days" />
    </div>

    @if (hasError('tentativeRangeDays')) {
      <span class="field-error" role="alert">Set a valid day range before continuing</span>
    }
  </div>

  <div class="size-result">
    <div class="size-result-text">
      <p class="size-result-label">Tentative Project Size</p>
      <p class="size-result-hint">Calculated automatically from the high end of your range</p>
    </div>
    @if (projectSize()) {
      <span class="size-badge size-{{ projectSize()!.toLowerCase() }}">{{ projectSize() }}</span>
    } @else {
      <span class="size-badge size-placeholder">—</span>
    }
  </div>

</div>

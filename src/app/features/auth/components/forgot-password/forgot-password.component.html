<div class="auth-page">
  <div class="auth-group">
    <div class="brand-panel">
      <div class="app-brand-group">
        <app-logo class="app-brand" [size]="220" />
        <span class="app-subtitle">Project Estimation</span>
      </div>
      <div class="brand-powered-by">
        <span class="powered-by-label">Powered by</span>
        <img src="/assets/images/company-logo.png" alt="Company logo" class="company-logo" />
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <app-button
          variant="link"
          label="Back to sign in"
          [fullWidth]="false"
          [showBackArrow]="true"
          (clicked)="onBackToLogin()"
        />
        <h2>Forgot password</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
      </div>

      <app-form
        [fields]="fields"
        [isSubmitting]="isSubmitting()"
        [submitError]="submitError()"
        [submitSuccess]="submitSuccess()"
        [successMessage]="successMessage"
        submitLabel="Send reset link"
        loadingLabel="Sending..."
        (formSubmit)="onSubmit($event)"
      />
    </div>
  </div>
</div>

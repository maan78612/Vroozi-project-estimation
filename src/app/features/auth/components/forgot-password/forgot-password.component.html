<div class="auth-page">
  <div class="auth-group">
    <div class="brand-panel">
      <img src="/assets/images/company-logo.png" alt="Company logo" class="logo" />
      <p class="brand-tagline">Smart estimates.<br />Delivered on time.</p>
      <div class="brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <app-button
          variant="link"
          label="Back to sign in"
          [fullWidth]="false"
          [showBackArrow]="true"
          (clicked)="onBackToLogin()"
        />
        <h2>Forgot password</h2>
        <p class="auth-subtitle">Enter your username and we will send reset instructions.</p>
      </div>

      <app-form
        [fields]="resetFields"
        submitLabel="Send reset link"
        loadingLabel="Sending..."
        [isSubmitting]="isSubmitting()"
        [submitError]="submitError()"
        [submitSuccess]="submitSuccess()"
        [successMessage]="successMessage()"
        (formSubmit)="onSubmit($event)"
      />
    </div>
  </div>
</div>

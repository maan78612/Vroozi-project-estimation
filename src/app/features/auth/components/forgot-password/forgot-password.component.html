<div class="auth-page">
  <div class="auth-group">
    <div class="brand-panel">
      <div class="app-brand-group">
        <app-logo class="app-brand" [size]="220" />
        <span class="app-subtitle">Project Estimation</span>
      </div>
      <div class="brand-powered-by">
        <span class="powered-by-label">Powered by</span>
        <img src="/assets/images/company-logo.png" alt="Company logo" class="company-logo" />
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <app-button
          variant="link"
          label="Back to sign in"
          [fullWidth]="false"
          [showBackArrow]="true"
          (clicked)="onBackToLogin()"
        />
        <h2>Forgot password</h2>
        <p class="auth-subtitle">Self-service password reset isn't available yet.</p>
      </div>

      <div class="auth-notice">
        <span class="material-symbols-outlined auth-notice-icon">admin_panel_settings</span>
        <p class="auth-notice-message">
          There's no automated reset flow yet — please contact your administrator directly and
          they can reset your password for you.
        </p>
      </div>
    </div>
  </div>
</div>

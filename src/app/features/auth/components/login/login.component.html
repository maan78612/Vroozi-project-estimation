<div class="auth-page">
  <button
    type="button"
    class="auth-theme-toggle"
    [attr.aria-label]="themeService.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [attr.title]="themeService.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    (click)="themeService.toggle()"
  >
    <span class="material-symbols-outlined">{{ themeService.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</span>
  </button>

  <div class="auth-group">

    <div class="brand-panel">
      <img src="/assets/images/company-logo.png" alt="Company logo" class="logo" />
      <p class="brand-tagline">Smart estimates.<br />Delivered on time.</p>
      <div class="brand-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome back</h2>
        <p class="auth-subtitle">Sign in to access your project estimations.</p>
      </div>

      <app-form
        [fields]="loginFields"
        submitLabel="Sign in"
        loadingLabel="Signing in..."
        [isSubmitting]="isSubmitting()"
        [submitError]="submitError()"
        (formSubmit)="onSubmit($event)"
      />

      <div class="auth-footer">
        <p class="auth-footer-text">Not an authorized user? Contact System Admin</p>
      </div>
    </div>

  </div>
</div>
